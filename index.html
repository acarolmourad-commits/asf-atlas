<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ASF Atlas — Mapa interativo dos picos de surf | ASF</title><meta name="description" content="Atlas interativo dos picos de surf do litoral norte de SP com Leaflet: nível, swell ideal e links para previsão por praia. Satélite do app ASF."><link rel="canonical" href="https://acarolmourad-commits.github.io/asf-atlas/"><meta name="theme-color" content="#00A8CC"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--p:#00A8CC;--d:#0E2439;--u:#9B59B6;--bg:#F7FBFC;--g:#5A6B7A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--d)}nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #E5EEF2;padding:10px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;z-index:1000}nav a{color:var(--p);text-decoration:none;font-weight:700;font-size:13px}nav a.on{color:var(--u)}header{background:linear-gradient(135deg,var(--p),var(--u));color:#fff;padding:36px 20px 26px;text-align:center}#map{height:62vh;margin:16px;border-radius:14px;box-shadow:0 2px 12px rgba(14,36,57,.12)}.muted{color:var(--g);font-size:12.5px;text-align:center;padding:0 16px 40px}footer{text-align:center;font-size:12.5px;color:var(--g);padding:24px;border-top:1px solid #E5EEF2}</style></head><body><nav><a href="https://acarolmourad-commits.github.io/asf-app/">🏄 App</a><a class="on" href="https://acarolmourad-commits.github.io/asf-atlas/">🗺️ Atlas</a><a href="https://acarolmourad-commits.github.io/asf-praias/">🏖️ Praias</a><a href="https://acarolmourad-commits.github.io/asf-previsao/">🌊 Previsão</a><a href="https://acarolmourad-commits.github.io/asf-carona/">🚗 Carona</a></nav><header><h1>🗺️ Atlas dos picos</h1><p>Todos os picos do litoral norte no mapa — toque para ver nível e swell ideal.</p></header><div id="map"></div><p class="muted">Dados de nível e swell também no <a href="https://acarolmourad-commits.github.io/asf-praias/" style="color:var(--p)">ASF Praias</a> · condições ao vivo no <a href="https://acarolmourad-commits.github.io/asf-previsao/" style="color:var(--p)">ASF Previsão</a>.</p><footer>🌊 ASF · <a href="https://acarolmourad-commits.github.io/" style="color:var(--p)">Hub de apps</a> · tiles © OpenStreetMap</footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([-23.65,-45.35],9);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);const picos=[['Praia da Baleia',-23.78,-45.67,'Iniciante · S/SE'],['Camburizinho',-23.77,-45.64,'Iniciante · S/SE'],['Maresias',-23.82,-45.56,'Intermediário · S/SE'],['Paúba',-23.79,-45.54,'Intermediário · S/SE'],['Juquehy',-23.76,-45.73,'Intermediário · SE'],['Boracéia',-23.72,-45.85,'Iniciante · SE'],['Brava (Caraguá)',-23.61,-45.41,'Avançado · S'],['Itamambuca',-23.40,-45.00,'Intermediário · E/SE'],['Perequê-Açu',-23.45,-45.08,'Iniciante · SE'],['Lagoinha',-23.48,-45.22,'Iniciante · S/SE']];picos.forEach(p=>{const c=p[2].startsWith('Iniciante')?'#0B8A5F':p[2].startsWith('Inter')?'#00A8CC':'#D7263D';L.circleMarker([p[1],p[2]],{radius:9,color:c,fillColor:c,fillOpacity:.7}).addTo(map).bindPopup(`<b>${p[0]}</b><br>${p[2]}<br><a href="https://acarolmourad-commits.github.io/asf-previsao/">ver previsão 🌊</a>`);});</script></body></html>
